<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Attic settings</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="form">
      <label class="row check">
        <input id="enabled" type="checkbox" />
        <span>Archive tabs I haven't used in a while</span>
      </label>

      <label class="row depends">
        <span>Archive tabs after</span>
        <select id="thresholdHours">
          <option value="1">1 hour</option>
          <option value="12">12 hours</option>
          <option value="24">1 day</option>
          <option value="168">7 days</option>
          <option value="720">30 days</option>
        </select>
      </label>

      <label class="row depends">
        <span>Keep archived tabs for</span>
        <select id="retentionDays">
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
          <option value="0">Forever</option>
        </select>
      </label>

      <label class="stack depends">
        <span>Never archive these sites</span>
        <textarea id="keepDomains" rows="5" placeholder="mail.google.com&#10;github.com"></textarea>
        <small class="muted">One domain per line. Subdomains are included.</small>
      </label>

      <p class="muted note">
        Pinned tabs, the tab you're looking at and tabs playing audio are never
        archived. Tabs in private windows are left alone and never stored.
      </p>

      <div class="row footer">
        <span id="saved" class="muted" aria-live="polite"></span>
        <button id="clear" type="button">Clear archive…</button>
      </div>
    </form>

    <script src="../lib/policy.js"></script>
    <script src="../lib/store.js"></script>
    <script src="options.js"></script>
  </body>
</html>
